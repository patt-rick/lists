<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // Pick the theme before the page paints, so it never flashes the wrong colours.
    (() => {
      let saved = null;
      try { saved = localStorage.getItem("lists-app:theme"); } catch { /* storage blocked: follow the device */ }
      document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved
        : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickd</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #fbe3ee;
      --panel: #fff0f6;
      --ink: #2a1f25;
      --muted: #6a5661;
      --line: #f2c2d8;
      --accent: #db2777;
      --accent-strong: #be185d;
      --accent-ink: #9d174d;
      --accent-soft: #f9d0e3;
      --on-accent: #ffffff;
      --danger: #b42318;
      --danger-soft: #fbd5d0;
      --radius: 10px;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1a1116;
      --panel: #24171e;
      --ink: #f6e8ef;
      --muted: #bfa3b1;
      --line: #45303b;
      --accent: #f472b6;
      --accent-strong: #f9a8d4;
      --accent-ink: #fbcfe8;
      --accent-soft: #4a1f35;
      --on-accent: #2a0f1d;
      --danger: #fca5a5;
      --danger-soft: #4a1c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    button, input { font: inherit; color: inherit; }
    ::placeholder { color: var(--muted); opacity: 1; }
    button { cursor: pointer; }

    .app {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; padding: 0 8px; }
    .brand img { width: 28px; height: 28px; }
    .lists { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .list-link {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      text-align: left;
    }
    .list-link:hover { background: var(--bg); }
    .list-link[aria-current="true"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
    .list-link .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count { font-size: 12px; color: var(--muted); font-weight: 500; }

    .new-list { display: flex; gap: 6px; margin-top: 4px; }

    .totals { margin: 0 8px; font-size: 13px; color: var(--muted); }

    input[type="text"], input[type="search"] {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    /* The search box sits alone in the column sidebar, so it must not grow like the row inputs do. */
    input[type="search"] { flex: none; -webkit-appearance: none; appearance: none; }
    input[type="text"]:focus, input[type="search"]:focus { outline: 2px solid var(--accent-strong); outline-offset: -1px; border-color: transparent; }
    .search-status { margin: -6px 8px 0; font-size: 13px; color: var(--muted); }
    /* Stays in the page when empty (so screen readers announce its first update); only the gap is cancelled. */
    .search-status:empty { margin-top: -12px; }

    .btn {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .btn:hover { background: var(--bg); }
    .btn.primary { background: var(--accent); border-color: var(--accent-strong); color: var(--on-accent); font-weight: 600; }
    .btn.primary:hover { background: var(--accent-strong); }
    .btn.danger { color: var(--danger); }
    .btn.danger:hover { background: var(--danger-soft); }
    /* Keyboard focus ring in the theme's colour, visible in both light and dark. */
    .btn:focus-visible, .icon-btn:focus-visible, .list-link:focus-visible, .result:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }

    /* Main */
    .main { padding: 32px clamp(16px, 5vw, 56px); max-width: 820px; width: 100%; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    input.title {
      flex: 1;
      min-width: 0;
      font-size: 26px;
      font-weight: 700;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 2px 6px;
      margin-left: -7px;
      background: transparent;
    }
    .title:hover { border-color: var(--line); }
    .title:focus { outline: 2px solid var(--accent-strong); }
    h2.title { margin: 0 0 20px; padding: 2px 0; font-size: 26px; overflow-wrap: anywhere; }
    .summary { color: var(--muted); margin: 0 0 20px; }

    .add-item { display: flex; gap: 8px; margin-bottom: 16px; }

    .items { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
    .items:empty { display: none; }
    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .item:last-child { border-bottom: 0; }
    .item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
    .item .text {
      flex: 1;
      min-width: 0;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 3px 6px;
      background: transparent;
    }
    .item .text:focus { outline: 2px solid var(--accent-strong); }
    .item.done .text { color: var(--muted); text-decoration: line-through; }
    .icon-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-size: 18px;
      line-height: 1;
      flex: none;
    }
    .icon-btn:hover { background: var(--danger-soft); color: var(--danger); }

    /* Search results: one full-width button per matching item. */
    .result {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: 10px 12px;
      border: 0;
      background: transparent;
      text-align: left;
      border-radius: var(--radius);
    }
    .result:hover { background: var(--bg); }
    .result-text { overflow-wrap: anywhere; }
    .result.done .result-text { color: var(--muted); text-decoration: line-through; }
    .result-list { max-width: 100%; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .items .result-row { border-bottom: 1px solid var(--line); }
    .items .result-row:last-child { border-bottom: 0; }

    /* The theme toggle borrows the icon-button shape but never turns red. */
    .theme-toggle { margin-left: auto; display: grid; place-items: center; }
    .theme-toggle:hover { background: var(--bg); color: var(--ink); }
    .theme-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    /* Shows the moon in light mode and the sun in dark mode: the theme you'd switch to. */
    .theme-toggle .sun, :root[data-theme="dark"] .theme-toggle .moon { display: none; }
    :root[data-theme="dark"] .theme-toggle .sun { display: block; }

    .warning { background: var(--danger-soft); color: var(--danger); border-radius: 8px; padding: 10px 12px; margin: 0 0 16px; }
    .empty { color: var(--muted); text-align: center; padding: 40px 0; }
    .footer { display: flex; justify-content: flex-end; margin-top: 12px; }

    @media (max-width: 700px) {
      .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="logo.png" alt="">Tickd
        <button type="button" class="icon-btn theme-toggle" id="theme-toggle" aria-label="Dark theme" aria-pressed="false">
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
      <input type="search" id="search" placeholder="Search items" aria-label="Search items in all lists" maxlength="200">
      <p class="search-status" id="search-status" role="status"></p>
      <ul class="lists" id="lists"></ul>
      <form class="new-list" id="new-list-form">
        <input type="text" id="new-list-name" placeholder="New list" aria-label="New list name" maxlength="80">
        <button class="btn" type="submit">Add</button>
      </form>
      <p class="totals" id="totals"></p>
    </aside>

    <div class="main">
      <p class="warning" id="warning" role="alert" hidden>Couldn't save — your browser is blocking or out of storage. Changes will be lost when you close this tab.</p>
      <div id="main"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "lists-app:v1";

    const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

    const isText = v => typeof v === "string" && v.trim() !== "";

    // Keeps only well-formed lists and items, so damaged saved data can never break the page.
    function clean(saved) {
      const lists = (Array.isArray(saved?.lists) ? saved.lists : [])
        .filter(l => l && isText(l.name))
        .map(l => ({
          id: isText(l.id) ? l.id : uid(),
          name: l.name,
          items: (Array.isArray(l.items) ? l.items : [])
            .filter(i => i && isText(i.text))
            .map(i => ({ id: isText(i.id) ? i.id : uid(), text: i.text, done: i.done === true })),
        }));
      return { lists, activeId: typeof saved?.activeId === "string" ? saved.activeId : null };
    }

    function load() {
      let raw = null;
      try { raw = localStorage.getItem(STORAGE_KEY); } catch { /* storage blocked: start fresh */ }
      if (raw !== null) {
        try { return clean(JSON.parse(raw)); } catch { /* unreadable: start fresh */ }
      }
      const first = { id: uid(), name: "My list", items: [] };
      return { lists: [first], activeId: first.id };
    }

    let state = load();
    const activeList = () => state.lists.find(l => l.id === state.activeId) || state.lists[0] || null;

    const $lists = document.getElementById("lists");
    const $main = document.getElementById("main");
    const $warning = document.getElementById("warning");
    const $newListForm = document.getElementById("new-list-form");
    const $newListName = document.getElementById("new-list-name");
    const $search = document.getElementById("search");
    const $searchStatus = document.getElementById("search-status");
    const $totals = document.getElementById("totals");

    // Search text, kept in memory only. While it's set, the main area shows matches from every list.
    let query = "";
    function clearSearch() { $search.value = ""; query = ""; }
    // Only writes when the text changes, so screen readers don't repeat an unchanged count.
    function setSearchStatus(text) { if ($searchStatus.textContent !== text) $searchStatus.textContent = text; }
    const count = (n, one, many) => `${n} ${n === 1 ? one : many}`;

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        $warning.hidden = true;
      } catch {
        $warning.hidden = false;
      }
    }

    // Enter finishes an edit, but not while an IME (e.g. Japanese input) is still composing.
    const blurOnEnter = e => { if (e.key === "Enter" && !e.isComposing) e.target.blur(); };

    // Saves typed text as it changes (no redraw, so the next click is never swallowed);
    // an emptied field snaps back to the last saved text when you leave it.
    function bindTextEdit(input, get, set, onSave = () => {}) {
      input.addEventListener("input", () => {
        const value = input.value.trim();
        if (value) { set(value); save(); onSave(); }
      });
      input.addEventListener("blur", () => { input.value = get(); });
      input.addEventListener("keydown", blurOnEnter);
    }

    // Builds an element; text is always set via textContent so user input is never parsed as HTML.
    function el(tag, props = {}, ...children) {
      const node = document.createElement(tag);
      Object.assign(node, props);
      node.append(...children);
      return node;
    }

    function renderSidebar() {
      const current = activeList();
      $lists.replaceChildren(...state.lists.map(list => {
        const left = list.items.filter(i => !i.done).length;
        const btn = el("button", { className: "list-link", type: "button" },
          el("span", { className: "name", textContent: list.name }),
          el("span", { className: "count", textContent: left || "" })
        );
        btn.dataset.id = list.id;
        btn.setAttribute("aria-current", String(list === current));
        btn.addEventListener("click", () => {
          clearSearch(); // so the list you picked actually shows
          state.activeId = list.id;
          update(`.list-link[data-id="${CSS.escape(list.id)}"]`);
        });
        return el("li", {}, btn);
      }));

      const all = state.lists.flatMap(l => l.items);
      const done = all.filter(i => i.done).length;
      $totals.textContent = all.length ? `${count(all.length, "item", "items")} · ${done} done` : "No items yet";
    }

    function renderResults() {
      const needle = query.toLocaleLowerCase();
      const matches = state.lists.flatMap(list => list.items
        .filter(item => item.text.toLocaleLowerCase().includes(needle))
        .map(item => ({ list, item })));
      setSearchStatus(matches.length ? count(matches.length, "match", "matches") : "No matches");

      const heading = el("h2", { className: "title", textContent: `Results for "${query}"` });
      if (!matches.length) {
        $main.replaceChildren(heading, el("p", { className: "empty", textContent: `No items match "${query}".` }));
        return;
      }
      $main.replaceChildren(heading, el("ul", { className: "items" }, ...matches.map(({ list, item }) => {
        const btn = el("button", { className: "result" + (item.done ? " done" : ""), type: "button" },
          el("span", { className: "result-text", textContent: item.text }),
          el("span", { className: "result-list", textContent: list.name })
        );
        btn.setAttribute("aria-label", `${item.text}, in ${list.name}${item.done ? ", done" : ""}`);
        // Opens the item's list and focuses its checkbox (not the text box, so phones don't pop up a keyboard).
        btn.addEventListener("click", () => {
          clearSearch();
          state.activeId = list.id;
          update(`.item[data-id="${CSS.escape(item.id)}"] input[type="checkbox"]`);
        });
        return el("li", { className: "result-row" }, btn);
      })));
    }

    function renderMain() {
      if (query) { renderResults(); return; }
      setSearchStatus("");

      const list = activeList();
      if (!list) {
        $main.replaceChildren(el("p", { className: "empty", textContent: "No lists yet. Create one on the left." }));
        return;
      }

      const total = list.items.length;
      const done = list.items.filter(i => i.done).length;

      const title = el("input", { className: "title", type: "text", value: list.name, maxLength: 80 });
      title.setAttribute("aria-label", "List name");
      bindTextEdit(title, () => list.name, v => { list.name = v; }, renderSidebar);

      const deleteList = el("button", { className: "btn danger", type: "button", textContent: "Delete list" });
      deleteList.addEventListener("click", () => {
        if (!confirm(`Delete "${list.name}" and its ${list.items.length} item(s)?`)) return;
        state.lists = state.lists.filter(l => l !== list);
        state.activeId = state.lists[0]?.id ?? null;
        update("#new-list-name");
      });

      const input = el("input", { type: "text", placeholder: "Add an item…", maxLength: 200 });
      input.setAttribute("aria-label", "New item");
      const addForm = el("form", { className: "add-item" },
        input,
        el("button", { className: "btn primary", type: "submit", textContent: "Add" })
      );
      addForm.addEventListener("submit", e => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        list.items.push({ id: uid(), text, done: false });
        update(".add-item input");
      });

      const items = el("ul", { className: "items" }, ...list.items.map(item => renderItem(list, item)));

      const children = [
        el("div", { className: "header" }, title, deleteList),
        el("p", { className: "summary", textContent: total ? `${done} of ${total} done` : "Nothing here yet" }),
        addForm,
        items,
      ];
      if (!total) children.push(el("p", { className: "empty", textContent: "Add your first item above." }));
      if (done) {
        const clear = el("button", { className: "btn", type: "button", textContent: `Clear ${done} done` });
        clear.addEventListener("click", () => { list.items = list.items.filter(i => !i.done); update(".add-item input"); });
        children.push(el("div", { className: "footer" }, clear));
      }
      $main.replaceChildren(...children);
    }

    function renderItem(list, item) {
      const check = el("input", { type: "checkbox", checked: item.done });
      check.setAttribute("aria-label", `Mark "${item.text}" done`);
      check.addEventListener("change", () => {
        item.done = check.checked;
        update(`.item[data-id="${CSS.escape(item.id)}"] input[type="checkbox"]`);
      });

      const text = el("input", { className: "text", type: "text", value: item.text, maxLength: 200 });
      text.setAttribute("aria-label", "Item text");
      bindTextEdit(text, () => item.text, v => { item.text = v; });

      const remove = el("button", { className: "icon-btn", type: "button", textContent: "×", title: "Delete item" });
      remove.setAttribute("aria-label", `Delete "${item.text}"`);
      remove.addEventListener("click", () => { list.items = list.items.filter(i => i !== item); update(".add-item input"); });

      const row = el("li", { className: "item" + (item.done ? " done" : "") }, check, text, remove);
      row.dataset.id = item.id;
      return row;
    }

    function render(focusSelector) {
      renderSidebar();
      renderMain();
      if (focusSelector) document.querySelector(focusSelector)?.focus();
    }

    // Every change saves, redraws, and puts keyboard focus back where it belongs.
    function update(focusSelector) {
      save();
      render(focusSelector);
    }

    // Theme: follows the device unless you've picked one with the toggle.
    // The head script already set data-theme before paint; this keeps it (and the button) in sync.
    const THEME_KEY = "lists-app:theme";
    const isTheme = v => v === "light" || v === "dark";
    const darkQuery = matchMedia("(prefers-color-scheme: dark)");
    const deviceTheme = () => darkQuery.matches ? "dark" : "light";
    const $themeToggle = document.getElementById("theme-toggle");

    const savedTheme = () => {
      try { const v = localStorage.getItem(THEME_KEY); return isTheme(v) ? v : null; } catch { return null; }
    };
    // Kept in memory as well as in storage, so the toggle still works when storage is blocked.
    let chosenTheme = savedTheme();

    function applyTheme() {
      const dark = (chosenTheme ?? deviceTheme()) === "dark";
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      // The label stays "Dark theme" for screen readers; the CSS swaps the moon/sun icon.
      $themeToggle.setAttribute("aria-pressed", String(dark));
      $themeToggle.title = dark ? "Switch to light theme" : "Switch to dark theme";
    }

    $themeToggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      // Picking the device's own theme goes back to following the device.
      chosenTheme = next === deviceTheme() ? null : next;
      try {
        if (chosenTheme) localStorage.setItem(THEME_KEY, chosenTheme);
        else localStorage.removeItem(THEME_KEY);
      } catch { /* storage blocked: the choice lasts until this tab closes */ }
      applyTheme();
    });

    darkQuery.addEventListener("change", applyTheme);
    applyTheme();

    // Another tab changed something: pick up its copy instead of overwriting it later.
    // The key is null when another tab cleared all storage, so re-read everything then.
    window.addEventListener("storage", e => {
      if (e.key === THEME_KEY || e.key === null) {
        chosenTheme = savedTheme();
        applyTheme();
      }
      if (e.key === STORAGE_KEY || e.key === null) {
        state = load();
        render();
      }
    });

    // Typing redraws only the main area, so the search box keeps focus.
    // "input" also covers the box's built-in clear (×) button.
    $search.addEventListener("input", () => { query = $search.value.trim(); renderMain(); });
    $search.addEventListener("keydown", e => {
      if (e.key === "Escape") { clearSearch(); renderMain(); }
      // Enter jumps to the first result (and closes the keyboard on phones).
      // preventDefault stops the same key press from also clicking the result it lands on.
      if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); $main.querySelector(".result")?.focus(); }
    });
    // Esc on a result also clears the search and goes back to the box.
    $main.addEventListener("keydown", e => {
      if (e.key === "Escape" && e.target.classList.contains("result")) { clearSearch(); renderMain(); $search.focus(); }
    });

    $newListForm.addEventListener("submit", e => {
      e.preventDefault();
      const name = $newListName.value.trim();
      if (!name) return;
      const list = { id: uid(), name, items: [] };
      clearSearch();
      state.lists.push(list);
      state.activeId = list.id;
      $newListName.value = "";
      update(".add-item input");
    });

    update();
  </script>
</body>
</html>
